server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:35479/analyzer}
    username: ${DB_USER:analyzer}
    password: ${DB_PASSWORD:analyzer_dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
